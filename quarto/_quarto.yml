project:
  type: website
  output-dir: ../docs
  render:
    - "*.qmd"
  resources:
    - models/annularis/tiles/**
    - models/natans/tiles/**
    - models/patchreef/scene_mesh_compact_textured.glb
    - vendor/**
    - viewer.js
    - tiled-viewer.js
    - openreef-icon.png


website:
  title: "OpenReef"
  favicon: favicon.svg
  site-url: https://marine-ecologist.github.io/openreef/
  repo-url: https://github.com/marine-ecologist/openreef
  search: false

  navbar:
    logo: openreef-icon.png
    background: "#444444"
    foreground: light

    left:
      - text: "Examples"
        menu:
          - href: orbicella.qmd
            text: "Orbicella annularis"
          - href: colpophyllia.qmd
            text: "Colpophyllia natans"
          - href: patchreef.qmd
            text: "Patch reef (northern Great Barrier Reef)"
    right:
      - icon: github
        href: https://github.com/marine-ecologist/openreef
        aria-label: "OpenReef on GitHub"
        
format:
  html:
    theme: cyborg
    css: styles.css
    toc: false
    include-in-header: _includes/importmap.html
